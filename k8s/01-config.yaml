apiVersion: v1
kind: ConfigMap
metadata:
  name: pollhub-config
  namespace: pollhub
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_DB: "pollhub"
  REDIS_HOST: "redis"
  KEYCLOAK_ISSUER_URI: "https://pollhub.local/auth/realms/pollhub"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/auth/realms/pollhub/protocol/openid-connect/certs"
  POLLHUB_CORS_ALLOWED_ORIGINS: "https://pollhub.local"
---

apiVersion: v1
kind: Secret
metadata:
  name: pollhub-secret
  namespace: pollhub
type: Opaque
stringData:
  POSTGRES_USER: "pollhub"
  POSTGRES_PASSWORD: "pollhub_secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: pollhub
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"