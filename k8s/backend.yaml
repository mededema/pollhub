apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pollhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: pollhub-backend:local
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: pollhub-config
            - secretRef:
                name: pollhub-secret
          resources:
            requests: { memory: "384Mi", cpu: "200m" }
            limits: { memory: "768Mi", cpu: "1000m" }
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pollhub
spec:
  selector:
    app: backend
  ports:
    - port: 8081