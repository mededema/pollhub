# Port du serveur
server.port=8081

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:pollhub}
spring.datasource.username=${POSTGRES_USER:pollhub}
spring.datasource.password=${POSTGRES_PASSWORD:pollhub}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# Keycloak JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/pollhub}

# Actuator Health checks (pour Kubernetes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Anti-bot Rate Limiting
pollhub.rate-limit.max-votes-per-minute=5