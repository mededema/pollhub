# Port du serveur
server.port=8081

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:pollhub}
spring.datasource.username=${POSTGRES_USER:pollhub}
spring.datasource.password=${POSTGRES_PASSWORD:pollhub}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Le dialecte est detecte automatiquement a partir du driver, pas besoin de le forcer
# Open-in-view desactive : la session Hibernate ne doit pas rester ouverte pendant le rendu de la vue,
# cela force les services a charger explicitement ce dont ils ont besoin (voir @Transactional readOnly)
spring.jpa.open-in-view=false

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# Keycloak JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/pollhub}

# Actuator Health checks (pour Kubernetes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Anti-bot Rate Limiting
pollhub.rate-limit.max-votes-per-minute=${POLLHUB_MAX_VOTES_PER_MINUTE:30}

# CORS : liste d'origines separees par des virgules, modifiable via variable d'environnement en k8s
pollhub.cors.allowed-origins=${POLLHUB_CORS_ALLOWED_ORIGINS:http://localhost:4200}