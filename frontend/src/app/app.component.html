<header class="app-header">
  <nav class="navbar" aria-label="Navigation principale">
    <a routerLink="/" class="brand" (click)="closeMobileMenu()" aria-label="PollHub, retour a l'accueil">
      <svg class="brand-logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="12" width="4" height="9" rx="1" stroke="currentColor" stroke-width="1.75" fill="none"/>
        <rect x="10" y="7" width="4" height="14" rx="1" stroke="currentColor" stroke-width="1.75" fill="none"/>
        <rect x="17" y="3" width="4" height="18" rx="1" stroke="currentColor" stroke-width="1.75" fill="none"/>
      </svg>
      <span class="brand-text">PollHub</span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="primary-menu"
      [attr.aria-label]="mobileMenuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'">
      @if (!mobileMenuOpen()) {
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      } @else {
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="5" y1="5" x2="19" y2="19"/>
          <line x1="19" y1="5" x2="5" y2="19"/>
        </svg>
      }
    </button>

    <div class="navbar-panel" id="primary-menu" [class.is-open]="mobileMenuOpen()">
      <ul class="nav-links">
        <li>
          <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">
            Sondages
          </a>
        </li>
        @if (authService.isLoggedIn()) {
          <li>
            <a routerLink="/create" routerLinkActive="is-active" (click)="closeMobileMenu()">
              Creer un sondage
            </a>
          </li>
        }
      </ul>

      <div class="navbar-user">
        @if (authService.isLoggedIn()) {
          <div class="user-badge">
            <span class="avatar" aria-hidden="true">{{ getInitial() }}</span>
            <span class="username">{{ authService.getUsername() }}</span>
          </div>
          <button type="button" class="btn btn-ghost" (click)="authService.logout()" aria-label="Se deconnecter">
            <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Deconnexion</span>
          </button>
        } @else {
          <button type="button" class="btn btn-primary" (click)="authService.login()">
            Connexion
          </button>
        }
      </div>
    </div>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>
